<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <title>Thomas's Home Page</title>
</head>
<body>
<h2>Thomas's Home Page</h2>
<h:outputText>Thomas's Home Page</h:outputText>
<p><a href="http://localhost:8080/MySpringHibernateJsfWebApp_war_exploded/home/java">Java</a></p>

<h:form>
    <p:growl id="msgs" showDetail="true"/>-->

    <p:panel header="Select a Location" style="margin-bottom:10px;">
        <h:panelGrid columns="2" cellpadding="5">
            <p:outputLabel for="country" value="Country: "/>
            <p:selectOneMenu id="country" value="#{dropdownView.country}" style="width:150px">
                <p:ajax listener="#{dropdownView.onCountryChange}" update="city"/>
                <f:selectItem itemLabel="Select Country" itemValue="" noSelectionOption="true"/>
                <f:selectItems value="#{dropdownView.countries}"/>
            </p:selectOneMenu>

            <p:outputLabel for="city" value="City: "/>
            <p:selectOneMenu id="city" value="#{dropdownView.city}" style="width:150px">
                <f:selectItem itemLabel="Select City" itemValue="" noSelectionOption="true"/>
                <f:selectItems value="#{dropdownView.cities}"/>
            </p:selectOneMenu>
        </h:panelGrid>

        <p:separator/>

        <p:commandButton value="Submit" update="msgs" action="#{dropdownView.displayLocation}" icon="pi pi-check"/>
    </p:panel>
</h:form>

</body>
</html>
