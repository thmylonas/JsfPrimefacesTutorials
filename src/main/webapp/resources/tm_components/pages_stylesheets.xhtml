<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<h:body>

    <ui:composition>

        <cc:interface>
            <cc:attribute name="stylesheets_pages" type="java.lang.String" required="true"
                          shortDescription="Defines the pages' level, to apply the stylesheets"/>
        </cc:interface>

        <cc:implementation>

            <!-- Stylesheets for general purpose -->
            <h:outputStylesheet name="css/styles_general/_styles_variables.css"/>
            <h:outputStylesheet name="css/styles_general/styles.css"/>
            <h:outputStylesheet name="css/styles_components/styles_center_section.css"/>
            <h:outputStylesheet name="css/styles_components/styles_top_section.css"/>
            <h:outputStylesheet name="css/styles_components/styles_bottom_section.css"/>

            <h:outputStylesheet name="css/styles_main_menubar/styles_main_menubar.css"/>
            <h:outputStylesheet name="css/styles_main_menubar/styles_main_menubar_icons.css"/>
            <h:outputStylesheet name="css/styles_main_menubar/styles_main_menubar_top_section.css"/>
            <h:outputStylesheet name="css/styles_main_menubar/styles_main_menubar_bottom_section.css"/>

            <c:if test="#{cc.attrs.stylesheets_pages.equals('stylesheets_pages_level1')}">

                <!-- Stylesheets for general purpose -->
                <h:outputStylesheet name="primeicons/primeicons.css" library="primefaces"/>
                <h:outputStylesheet name="css/styles_components/styles_right_section.css"/>

                <!-- Stylesheets of "styles_pages_level_1" -->
                <h:outputStylesheet name="css/styles_pages_level_1/styles_home/styles_home.css"/>
                <h:outputStylesheet name="css/styles_pages_level_1/styles_jsf/styles_jsf.css"/>
                <h:outputStylesheet name="css/styles_pages_level_1/styles_primefaces/styles_primefaces.css"/>
                <h:outputStylesheet name="css/styles_pages_level_1/styles_jsf_jpa/styles_jsf_jpa.css"/>

            </c:if>

            <c:if test="#{cc.attrs.stylesheets_pages.equals('stylesheets_pages_level2')}">

                <!-- Stylesheets of "styles_pages_level_2" -->
                <h:outputStylesheet name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_primefaces/styles_primefaces_data_tables.css"/>

                <!-- Stylesheets of "styles_pages_level_3" -->
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_command_button.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_input_text.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_output_format.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_output_label.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_select_boolean_checkbox.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_select_many_checkbox.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_select_many_listbox.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_select_many_menu.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_select_one_listbox.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_select_one_menu.css"/>
                <h:outputStylesheet
                        name="css/styles_pages_level_2/styles_jsf/styles_jsf_h_taglib/styles_jsf_h_select_one_radio.css"/>

            </c:if>

        </cc:implementation>

    </ui:composition>

</h:body>
</html>
