<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:tm="http://xmlns.jcp.org/jsf/composite/tm_components"
      xmlns:p="http://primefaces.org/ui">

<h:body>
    <ui:composition>

        <cc:interface>
            <cc:attribute name="model"
                          type="com.thomasmylonas.jsf_primefaces_tutorials.data_access_layer.entities.Student"
                          required="true"
                          shortDescription="The Student instance which will store the temporary Student's input"/>
            <cc:attribute name="style_class" type="java.lang.String" required="false"
                          shortDescription="The styleClass of the student_insert_data"/>
        </cc:interface>

        <cc:implementation>

            <tm:input_text_label input_value="#{cc.attrs.model.lastName}"
                                 label="Enter the student's Last Name:" placeholder="Last Name"
                                 max_length="30" size="30" style_class="#{cc.attrs.style_class}"/>

            <tm:input_text_label input_value="#{cc.attrs.model.firstName}"
                                 label="Enter the student's First Name:" placeholder="First Name"
                                 max_length="20" size="20" style_class="#{cc.attrs.style_class}"/>

            <div class="ui-g">
                <div class="ui-g-6">
                    <p:outputLabel for="dateOfBirth" value="Enter the student's Date of Birth:"/>
                    <p:watermark for="dateOfBirth" value="Date of Birth"/>
                </div>
                <div class="ui-g-6">
                    <p:datePicker id="dateOfBirth" value="#{cc.attrs.model.dateOfBirth}"
                                  monthNavigator="true" yearNavigator="true" showWeek="true"
                                  yearRange="1900:2004" styleClass="#{cc.attrs.style_class}"/>
                </div>
            </div>

            <tm:input_text_label input_value="#{cc.attrs.model.absences}"
                                 label="Enter the student's Absences:" placeholder="Absences"
                                 max_length="5" size="5" style_class="#{cc.attrs.style_class}"/>

            <tm:input_text_label input_value="#{cc.attrs.model.departmentId}"
                                 label="Enter the student's Department ID:" placeholder="Department ID"
                                 max_length="10" size="10" style_class="#{cc.attrs.style_class}"/>

            <div class="ui-g">
                <div class="ui-g-6">
                    <p:outputLabel for="status" value="Enter the student's Status:"/>
                </div>
                <div class="ui-g-6">
                    <p:selectOneMenu id="status" value="#{cc.attrs.model.status}"
                                     styleClass="#{cc.attrs.style_class} select_one_menu_input_field">
                        <f:selectItem itemLabel="Select Status" itemValue=""/>
                        <f:selectItem itemLabel="Advanced Student" itemValue="ADVANCED_STUDENT"/>
                        <f:selectItem itemLabel="Medium Student" itemValue="MEDIUM_STUDENT"/>
                        <f:selectItem itemLabel="Junior Student" itemValue="JUNIOR_STUDENT"/>
                    </p:selectOneMenu>
                </div>
            </div>

        </cc:implementation>

    </ui:composition>
</h:body>
</html>
