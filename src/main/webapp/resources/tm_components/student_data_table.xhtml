<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:p="http://primefaces.org/ui">

<h:body>

    <ui:composition>

        <cc:interface>
            <cc:attribute name="title" type="java.lang.String" required="false"
                          shortDescription="The title of the data_table"/>
            <cc:attribute name="studentList" type="java.util.List" required="true"
                          shortDescription="List of Student"/>
            <cc:attribute name="style_class" type="java.lang.String" required="false"
                          shortDescription="The styleClass of the student_data_table"/>
        </cc:interface>

        <cc:implementation>

            <p:dataTable value="#{cc.attrs.studentList}" var="student"
                         scrollable="true" stickyHeader="true" resizableColumns="true" border="1"
                         styleClass="#{cc.attrs.style_class}">
                <f:facet name="header">#{cc.attrs.title}</f:facet>
                <p:column>
                    <f:facet name="header">ID</f:facet>
                    #{student.id}
                </p:column>
                <p:column>
                    <f:facet name="header">LAST_NAME</f:facet>
                    #{student.lastName}
                </p:column>
                <p:column>
                    <f:facet name="header">FIRST_NAME</f:facet>
                    #{student.firstName}
                </p:column>
                <p:column>
                    <f:facet name="header">DATE_OF_BIRTH</f:facet>
                    #{student.dateOfBirth}
                </p:column>
                <p:column>
                    <f:facet name="header">ABSENCES</f:facet>
                    #{student.absences}
                </p:column>
                <p:column>
                    <f:facet name="header">DEPARTMENT_ID</f:facet>
                    #{student.departmentId}
                </p:column>
                <p:column>
                    <f:facet name="header">STATUS</f:facet>
                    #{student.status}
                </p:column>
            </p:dataTable>

        </cc:implementation>

    </ui:composition>

</h:body>
</html>
