<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:p="http://primefaces.org/ui">

<h:body>

    <ui:composition>

        <!--<h:outputScript name="js/js_pages_level_1/js_primefaces/js_menubar.js"/>-->

        <cc:interface>
            <cc:attribute name="options_rendered" type="java.lang.Boolean" required="true"
                          shortDescription="Controls if options in mainMenuBar will be rendered or not"/>
            <cc:attribute name="main_menubar_style" type="java.lang.String" required="true"
                          shortDescription="Defines the CSS style of the component"/>
            <cc:attribute name="render_main_menubar_icons" type="java.lang.Boolean" required="false"
                          shortDescription="Usage not defined yet"/>
        </cc:interface>

        <cc:implementation>

            <h:form>

                <p:menubar styleClass="#{cc.attrs.main_menubar_style}" toggleEvent="click">

                    <p:menuitem value="#{msg['page_level1.main_menubar.home']}"
                                url="#{msg['webapp_link']}facelets/home"/>

                    <p:submenu label="#{msg['no_page.main_menubar.jsf']}">
                        <p:menuitem value="#{msg['page_level1.main_menubar.jsf']}"
                                    url="#{msg['webapp_link']}facelets/jsf"
                                    icon="jsf"/>
                        <p:menuitem value="#{msg['page_level1.main_menubar.primefaces']}"
                                    url="#{msg['webapp_link']}facelets/primefaces"
                                    icon="primefaces"/>
                    </p:submenu>

                    <p:menuitem value="#{msg['page_level1.main_menubar.student_home']}"
                                url="#{msg['webapp_link']}facelets/student-home"/>

                    <p:menuitem value="#{msg['page_level1.main_menubar.about']}"
                                url="#{msg['webapp_link']}facelets/about"/>

                    <f:facet name="options">
                        <p:outputPanel rendered="#{cc.attrs.options_rendered}" styleClass="options">
                            <p:inputText placeholder="#{msg['no_page.main_menubar.search']}"
                                         styleClass="options_input"/>
                            <p:commandButton type="button" value="Logout" icon="logout_icon"
                                             styleClass="options_logout"/>
                        </p:outputPanel>
                    </f:facet>

                </p:menubar>

            </h:form>

        </cc:implementation>

    </ui:composition>

</h:body>
</html>
