<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:p="http://primefaces.org/ui">

<h:body>

    <ui:composition>

        <cc:interface/>

        <cc:implementation>

            <h:form styleClass="change_lang_wrapper">
                <h:outputText value="#{msg['change_lang']} EN/GR: " styleClass="change_lang_label"/>
                <p:selectBooleanButton value="#{faceletsLocaleService.english}" onchange="submit()"
                                       valueChangeListener="#{faceletsLocaleService.switchLocale}"
                                       onLabel="" offLabel=""
                                       styleClass="#{faceletsLocaleService.loadFlagCss()}"/>
            </h:form>

        </cc:implementation>

    </ui:composition>

</h:body>
</html>
