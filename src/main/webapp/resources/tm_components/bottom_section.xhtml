<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:tm="http://xmlns.jcp.org/jsf/composite/tm_components">

<h:body>
    <ui:composition>

        <cc:interface/>

        <cc:implementation>

            <div class="ui-g">
                <div class="ui-g-12">
                    <tm:main_menubar options_rendered="false" main_menubar_style="main_menubar_bottom_section"
                                     render_main_menubar_icons="false"/>
                </div>
            </div>
            <div class="ui-g">
                <div class="ui-g-8">
                    <div class="copyright_wrapper">
                        <h:outputText value="#{msg['copyright']}" styleClass="copyright"/>
                    </div>
                </div>
                <div class="ui-g-2">
                    <div class="social_media_bottom_section">
                        <tm:social_media
                                social_media_wrapper_style_class="social_media_bottom_section_wrapper"/>
                    </div>
                </div>
                <div class="ui-g-2 navigate_buttons_wrapper">
                    <ui:insert name="navigate_buttons">
                        <tm:navigate_buttons back_to_home_rendered="true"/>
                    </ui:insert>
                </div>
            </div>

        </cc:implementation>

    </ui:composition>
</h:body>
</html>
