<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:cc="http://xmlns.jcp.org/jsf/composite"
      xmlns:p="http://primefaces.org/ui">

<h:body>

    <ui:composition>

        <cc:interface>
            <cc:attribute name="back_to_home_rendered" type="java.lang.Boolean" required="true"
                          shortDescription="Controls if 'BackToHome' button will be rendered or not"/>
        </cc:interface>

        <cc:implementation>

            <div class="ui-g-5 ui-sm-12">
                <div class="back_to_home_wrapper">
                    <h:outputLink value="#{msg['webapp_link']}home"
                                  rendered="#{cc.attrs.back_to_home_rendered}">
                        <p:graphicImage value="#{resource['images/navigation_btns/BackToHome.png']}" alt="Home"
                                        width="35px" height="30px"/>
                    </h:outputLink>
                </div>
            </div>
            <div class="ui-g-7 ui-sm-12">
                <div class="back_to_top_wrapper">
                    <h:outputLink value="#">
                        <p:graphicImage value="#{resource['images/navigation_btns/BackToTop.png']}"
                                        alt="Back To Top" styleClass="back_to_top"/>
                    </h:outputLink>
                </div>
            </div>

        </cc:implementation>

    </ui:composition>

</h:body>
</html>
