<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:tm="http://xmlns.jcp.org/jsf/composite/tm_components">

<f:view locale="#{faceletsLocaleService.locale}">
    <h:head>
        <!-- Metadata -->
        <meta name="author" content="Thomas Mylonas"/>
        <ui:insert name="metadata_desc">
            <meta name="description" content="Page default description"/>
        </ui:insert>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>

        <!-- Favicon -->
        <c:set var="pathToThomasMylonasJpg"
               value="#{imagesService.getImagesEnum('MENUBAR_ICON_THOMAS_MYLONAS_IMAGE').imageFullNameWithPath}"/>
        <!--pathToThomasMylonasJpg == 'images/menubar_icons/about/ThomasMylonas.jpg'-->
        <link rel="shortcut icon" href="#{resource[pathToThomasMylonasJpg]}"/>

        <!-- Stylesheets -->
        <tm:pages_stylesheets stylesheets_pages="stylesheets_pages_level1"/>

        <ui:insert name="head_page_title">
            <title>Page Title</title>
        </ui:insert>
    </h:head>
    <h:body styleClass="body">

        <div class="ui-g">
            <div class="ui-g-12 top_section_grid">
                <div class="top_section">
                    <tm:top_section/>
                </div>
            </div>
        </div>

        <div class="ui-g">
            <div class="ui-g-12 main_menubar_top_section_grid">
                <tm:main_menubar options_rendered="true" main_menubar_style="main_menubar_top_section"/>
            </div>
        </div>

        <div class="ui-g">

            <div class="ui-g-9 center_section_grid">
                <div class="center_section">
                    <tm:center_section/>
                </div>
            </div>

            <div class="ui-g-3 right_section_grid">
                <div class="right_section">
                    <tm:right_section/>
                </div>
            </div>

        </div>

        <div class="ui-g">
            <div class="ui-g-12 bottom_section_grid">
                <div class="bottom_section">
                    <tm:bottom_section/>
                </div>
            </div>
        </div>

    </h:body>
</f:view>
</html>
