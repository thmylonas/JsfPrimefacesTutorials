<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:tm="http://xmlns.jcp.org/jsf/composite/tm_components"
      xmlns:p="http://primefaces.org/ui">

<h:body>

    <ui:composition template="../templates/pages_level2_template.xhtml">

        <ui:define name="metadata_desc">
            <meta name="description" content="#{msg['page_level1.metadata_desc.jsf_jpa']}"/>
        </ui:define>

        <ui:define name="head_page_title">
            <title>#{msg['page_level1.head_page_title.jsf_jpa']}</title>
        </ui:define>

        <ui:define name="center_section_title">
            <h:outputText value="#{msg['page_level1.center_section.title.jsf_jpa']}"/>
        </ui:define>

        <ui:define name="center_section_content">

            <p>
                <h:outputText value="The 'Student' table#{jsfJpaBackingBean.fetchDatasource()}"
                              escape="false" styleClass="technology_topics_titles"/>
            </p>

            <div class="select_datasource">
                <h:form>
                    <div>
                        <p:outputLabel for="datasource" value="Select Datasource (In-Memory/Database):"/>
                        <p:selectOneMenu id="datasource" value="#{jsfJpaBackingBean.datasource}"
                                         styleClass="select_one_menu_input_field">
                            <f:selectItem itemLabel="Select Datasource" itemValue=""/>
                            <f:selectItem itemLabel="In-Memory Datasource" itemValue="InMemoryDS"/>
                            <f:selectItem itemLabel="Database Datasource" itemValue="DatabaseDS"/>
                        </p:selectOneMenu>
                    </div>
                    <br/>
                    <div>
                        <p:commandButton type="button" value="Select Datasource">
                            <p:ajax process="@form" update="@all"
                                    listener="#{jsfJpaBackingBean.selectDatasource()}"/>
                        </p:commandButton>
                    </div>
                </h:form>
            </div>

            <dl class="technology_topics_list_wrapper #{jsfJpaBackingBean.displayDataFormsInView()} ">
                <dt>Display a Student (given its ID)</dt>
                <dd>
                    <h:form>
                        <!--
                        In the "p:inputText", if the "value" attribute is defined:
                        - as "long" with no-value assigned, the "p:inputText" will display "0" and not the "placeholder"
                        - as "Long" with no-value assigned (null), the "p:inputText" will display the "placeholder" (not "null")
                        Alternatively, instead of "p:watermark", we can use "p:inputText"'s "placeholder" attribute
                        -->
                        <div class="data_insert_form">
                            <tm:input_text_label
                                    input_value="#{jsfJpaBackingBean.jsfJpaService.studentId}"
                                    label="Enter the student's ID:" placeholder="ID"
                                    max_length="5" size="2" style_class="insert_data"/>
                        </div>

                        <tm:student_data_table title="Display the filtered Student"
                                               studentList="#{jsfJpaBackingBean.jsfJpaService.studentsFiltered}"
                                               style_class="table_students_list"/>

                        <div>
                            <p:commandButton type="button" value="Find student">
                                <p:ajax process="@form" update="@form @(.table_students_list)"
                                        listener="#{jsfJpaBackingBean.jsfJpaService.findStudentById()}"/>
                            </p:commandButton>
                            <p:commandButton value="Reset form" styleClass="student_reset_btn">
                                <p:ajax process="@form" update="@form"
                                        listener="#{jsfJpaBackingBean.resetFetchByIdForm()}"/>
                            </p:commandButton>
                        </div>
                    </h:form>
                </dd>

                <dt>Display all the Students</dt>
                <dd>
                    <tm:student_data_table title="Display all the Students"
                                           studentList="#{jsfJpaBackingBean.jsfJpaService.findAllStudents()}"
                                           style_class="table_students_list"/>
                </dd>

                <dt>Add a new Student</dt>
                <dd>
                    <h:form id="formWhichSavesNewStudent">
                        <div class="data_insert_form">
                            <tm:student_insert_data
                                    model="#{jsfJpaBackingBean.jsfJpaService.saveFormStudent}"
                                    style_class="insert_data"/>
                        </div>

                        <tm:student_data_table title="Display all the Students"
                                               studentList="#{jsfJpaBackingBean.jsfJpaService.findAllStudents()}"
                                               style_class="table_students_list"/>

                        <div>
                            <p:commandButton type="button" value="Add student">
                                <p:ajax process="@form" update="@form @(.table_students_list)"
                                        listener="#{jsfJpaBackingBean.jsfJpaService.saveNewStudent(jsfJpaBackingBean.jsfJpaService.saveFormStudent)}"/>
                            </p:commandButton>
                            <p:commandButton value="Reset form" styleClass="student_reset_btn">
                                <p:ajax process="@form" update="@form"
                                        listener="#{jsfJpaBackingBean.resetSaveForm()}"/>
                            </p:commandButton>
                        </div>
                    </h:form>
                </dd>

                <dt>Update an existing Student</dt>
                <dd>
                    <h:form id="formWhichUpdatesStudent">
                        <div class="data_insert_form">
                            <tm:input_text_label
                                    input_value="#{jsfJpaBackingBean.jsfJpaService.updateFormStudentId}"
                                    label="Enter the student's ID:" placeholder="ID"
                                    max_length="5" size="2" style_class="insert_data"/>
                            <tm:student_insert_data
                                    model="#{jsfJpaBackingBean.jsfJpaService.updateFormStudent}"
                                    style_class="insert_data"/>
                        </div>

                        <tm:student_data_table title="Display all the Students"
                                               studentList="#{jsfJpaBackingBean.jsfJpaService.findAllStudents()}"
                                               style_class="table_students_list"/>

                        <div>
                            <p:commandButton type="button" value="Update student">
                                <p:ajax process="@form" update="@form @(.table_students_list)"
                                        listener="#{jsfJpaBackingBean.jsfJpaService.updateStudent(jsfJpaBackingBean.jsfJpaService.updateFormStudent, jsfJpaBackingBean.jsfJpaService.updateFormStudentId)}"/>
                            </p:commandButton>
                            <p:commandButton value="Reset form" styleClass="student_reset_btn">
                                <p:ajax process="@form" update="@form"
                                        listener="#{jsfJpaBackingBean.resetUpdateForm()}"/>
                            </p:commandButton>
                        </div>
                    </h:form>
                </dd>

                <dt>Delete a Student (given its ID)</dt>
                <dd>
                    <h:form id="formWhichDeletesStudentById">
                        <div class="data_insert_form">
                            <tm:input_text_label
                                    input_value="#{jsfJpaBackingBean.jsfJpaService.deleteFormStudentId}"
                                    label="Enter the student's ID:" placeholder="ID"
                                    max_length="5" size="2" style_class="insert_data"/>
                        </div>

                        <tm:student_data_table title="Display all the Students"
                                               studentList="#{jsfJpaBackingBean.jsfJpaService.findAllStudents()}"
                                               style_class="table_students_list"/>

                        <div>
                            <p:commandButton type="button" value="Delete student">
                                <p:ajax process="@form" update="@form @(.table_students_list)"
                                        listener="#{jsfJpaBackingBean.jsfJpaService.deleteStudent()}"/>
                            </p:commandButton>
                            <p:commandButton value="Reset form" styleClass="student_reset_btn">
                                <p:ajax process="@form" update="@form"
                                        listener="#{jsfJpaBackingBean.resetDeleteForm()}"/>
                            </p:commandButton>
                        </div>
                    </h:form>
                </dd>
            </dl>

        </ui:define>

    </ui:composition>

</h:body>
</html>
