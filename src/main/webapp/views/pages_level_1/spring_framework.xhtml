<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:tm="http://xmlns.jcp.org/jsf/composite/tm_components"
      xmlns:p="http://primefaces.org/ui">

<h:body>

    <ui:composition template="../templates/pages_level1_template.xhtml">

        <ui:define name="metadata_desc">
            <meta name="description" content="#{msg['page_level1.metadata_desc.spring_framework']}"/>
        </ui:define>

        <ui:define name="head_page_title">
            <title>#{msg['page_level1.head_page_title.spring_framework']}</title>
        </ui:define>

        <ui:define name="center_section_title">
            <h:outputText value="#{msg['page_level1.center_section.title.spring_framework']}"/>
        </ui:define>

        <ui:define name="center_section_content">

            <p>
                <h:outputText value="Spring Framework topics" styleClass="technology_topics_titles"/>
            </p>

            <div class="technology_topics_group_wrapper">
                <div>
                    <tm:special_link
                            link_url="#{msg['webapp_link']}api/student-alt/student-alt-home/home"
                            link_text="Simple 'StudentAlt' (alternative) API"
                            link_tooltip="#{msg['webapp_link']}api/student-alt/student-alt-home/home"
                            target_blank="_blank" link_style="technology_topics_list"/>
                </div>
                <div>
                    <tm:special_link
                            link_url="#"
                            link_text="Topic 2"
                            link_tooltip="#"
                            target_blank="_blank" link_style="technology_topics_list"/>
                </div>
            </div>

        </ui:define>

        <ui:define name="right_section_title">
            <h:outputText value="#{msg['page_level1.right_section.title.spring_framework']}"/>
        </ui:define>

        <ui:define name="right_section_image">
            <c:set var="pathToSpringFrameworkPng"
                   value="#{imagesService.getImagesEnum('SPRING_FRAMEWORK_IMAGE').imageFullNameWithPath}"/>
            <!--pathToSpringFrameworkPng == 'images/java_frameworks/SpringFramework.png'-->
            <p:graphicImage value="#{resource[pathToSpringFrameworkPng]}"
                            alt="#{msg['page_level1.right_section.image_alt.spring_framework']}"
                            styleClass="right_section_image spring_framework_image"/>
        </ui:define>

        <ui:define name="right_section_content">
            <h:outputText
                    value="#{msg['page_level1.right_section.title.spring_framework']}: #{msg['right.section.content']}"/>
        </ui:define>

    </ui:composition>

</h:body>
</html>
