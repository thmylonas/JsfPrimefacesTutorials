<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:tm="http://xmlns.jcp.org/jsf/composite/tm_components"
      xmlns:p="http://primefaces.org/ui">

<h:body>
    <ui:composition template="../templates/pages_level1_template.xhtml">

        <ui:define name="metadata_desc">
            <meta name="description" content="#{msg['page_level1.metadata_desc.primefaces']}"/>
        </ui:define>

        <ui:define name="head_page_title">
            <title>#{msg['page_level1.head_page_title.primefaces']}</title>
        </ui:define>

        <ui:define name="center_section_title">
            <h:outputText value="#{msg['page_level1.center_section.title.primefaces']}"/>
        </ui:define>

        <ui:define name="center_section_content">

            <p>
                <h:outputText value="Primefaces Framework topics" styleClass="technology_topics_titles"/>
            </p>

            <div class="technology_topics_group_wrapper">
                <div>
                    <tm:special_link
                            link_url="#{msg['webapp_link']}facelets/primefaces-data-tables"
                            link_text="DataTables"
                            link_tooltip="#{msg['webapp_link']}facelets/primefaces-data-tables"
                            target_blank="_blank" link_style="technology_topics_list"/>
                </div>
                <div>
                    <tm:special_link
                            link_url="#"
                            link_text="Other topic"
                            link_tooltip="#"
                            target_blank="_blank" link_style="technology_topics_list"/>
                </div>
            </div>

            <p>
                <h:outputText value="Primefaces 'p:contentFlow' Example"
                              styleClass="technology_topics_titles"/>
            </p>

            <p:contentFlow value="#{primefacesContentFlowService.imagesFilteredByIndexes}"
                           var="image" styleClass="content_flow">
                <p:graphicImage value="#{resource[image.fetchImageFullNameWithPath()]}"
                                height="33%" styleClass="content"/>
                <div class="content_flow_image_names">
                    <h:outputText value="#{image.imageDescription}"/>
                </div>
            </p:contentFlow>

            <p>
                <h:outputText value="Primefaces 'p:contentFlow' Example (Alternative)"
                              styleClass="technology_topics_titles"/>
            </p>

            <p:contentFlow value="#{primefacesContentFlowAltService.imagesNamesFilteredByIndexes}"
                           var="imageName" styleClass="content_flow">
                <p:graphicImage
                        value="#{resource[primefacesContentFlowAltService.fetchImageFullNameWithPathForName(imageName)]}"
                        height="33%" styleClass="content"/>
                <div class="content_flow_image_names">
                    <h:outputText value="#{primefacesContentFlowAltService.fetchImageDescriptionForName(imageName)}"/>
                </div>
            </p:contentFlow>

        </ui:define>

        <ui:define name="right_section_title">
            <h:outputText value="#{msg['page_level1.right_section.title.primefaces']}"/>
        </ui:define>

        <ui:define name="right_section_image">
            <c:set var="pathToPrimefacesPng"
                   value="#{imagesService.fetchAppImage('PRIMEFACES_IMAGE').fetchImageFullNameWithPath()}"/>
            <!--pathToPrimefacesPng == 'images/java_frameworks/Primefaces.png'-->
            <p:graphicImage value="#{resource[pathToPrimefacesPng]}"
                            alt="#{msg['page_level1.right_section.image_alt.primefaces']}"
                            styleClass="right_section_image primefaces_image"/>
        </ui:define>

        <ui:define name="right_section_content">
            <h:outputText
                    value="#{msg['page_level1.right_section.title.primefaces']}: #{msg['right.section.content']}"/>
        </ui:define>

    </ui:composition>
</h:body>
</html>
