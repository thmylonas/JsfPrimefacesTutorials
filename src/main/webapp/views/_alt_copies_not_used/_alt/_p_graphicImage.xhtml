<!DOCTYPE html>
<!-- Example for <p:graphicImage/> -->
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Example for "p:graphicImage"</title>
</h:head>
<h:body>

    <div>
        <p:graphicImage id="imageTM" value="#{resource['images/about/ThomasMylonas.jpg']}"
                        alt="Thomas Mylonas" styleClass="right_section_image"/>
        <p:graphicImage library="images" value="ThomasMylonas.jpg" height="33%"/>
        <p:resizable for="imageTM" aspectRatio="true"/>
    </div>

</h:body>
</html>
