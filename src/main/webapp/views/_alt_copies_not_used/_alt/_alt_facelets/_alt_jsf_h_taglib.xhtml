<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:body>
    <ui:composition template="../../../templates/pages_level2_template.xhtml">

        <!-- ... -->

        <ui:define name="center_section_content">

            <p>
                <h:outputText value="Common attributes list for UI components:"
                              styleClass="h_taglib_subtitles"/>
            </p>
            <h:panelGrid columns="5" border="1" cellpadding="3">
                <f:facet name="header">
                    Common attributes list for UI components
                </f:facet>
                <h:outputText value="Property"/><h:outputText value="Type"/><h:outputText value="Default Value"/>
                <h:outputText value="Required?"/><h:outputText value="Description"/>
                <h:outputText value="id"/><h:outputText value="String"/><h:outputText value="None"/>
                <h:outputText value="Yes"/><h:outputText value="Component identifier"/>
                <h:outputText value="value"/><h:outputText value="Object"/><h:outputText value="None"/>
                <h:outputText value="Yes"/>
                <h:outputText
                        value="The component's current local value. Can be literal text or a value-binding expression"/>
                <h:outputText value="rendered"/><h:outputText value="boolean"/><h:outputText value="true"/>
                <h:outputText value="No"/><h:outputText value="Controls whether or not the component is visible"/>
                <h:outputText value="converter"/>
                <h:outputText value="Converter instance (value-binding expression or converter identifier)"/>
                <h:outputText value="None"/><h:outputText value="No"/>
                <h:outputText value="Sets the converter used to convert the value to and from a string for display"/>
                <h:outputText value="styleClass"/><h:outputText value="String"/><h:outputText value="None"/>
                <h:outputText value="No"/>
                <h:outputText
                        value="Name of CSS style class; rendered as an HTML class attribute. Multiple classes can be specified with a space in between them"/>
                <h:outputText value="binding"/><h:outputText value="String"/><h:outputText value="None"/>
                <h:outputText value="No"/>
                <h:outputText
                        value="A value-binding expression that associates this component with a backing bean property"/>
            </h:panelGrid>

            <!-- ... -->

        </ui:define>

        <!-- ... -->

    </ui:composition>
</h:body>
</html>
