<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:tm="http://xmlns.jcp.org/jsf/composite/tm_components">

<h:body>

    <ui:composition template="../../../templates/pages_level2_template.xhtml">

        <ui:define name="metadata_desc">
            <meta name="description" content="JavaServer Faces: HTML Tag Library (h Taglib) - h:column"/>
        </ui:define>

        <ui:define name="head_page_title">
            <title>JavaServer Faces: HTML Tag Library (h Taglib) - h:column</title>
        </ui:define>

        <ui:define name="center_section_title">
            <tm:special_link
                    link_url="#{msg['main_components_url.vdldocs.prefix']}column#{msg['main_components_url.vdldocs.suffix']}"
                    link_text="JavaServer Faces: HTML Tag Library (h Taglib) - &lt;h:column&gt;"
                    link_tooltip="#{msg['main_components_url.vdldocs.prefix']}column#{msg['main_components_url.vdldocs.suffix']}"
                    target_blank="_blank" link_style="center_section_title_link"/>
        </ui:define>

        <ui:define name="center_section_content">

            <p>
                <h:outputText value="JakartaEE API package/class:" styleClass="h_taglib_subtitles"/>
            </p>
            <div>
                <tm:special_link
                        link_url="#{msg['main_components_url.html.prefix']}HtmlColumn#{msg['main_components_url.suffix']}"
                        link_text="javax.faces.component.html.HtmlColumn"
                        link_tooltip="#{msg['main_components_url.html.prefix']}HtmlColumn#{msg['main_components_url.suffix']}"
                        target_blank="_blank" link_style="api_package_class"/>
                <span>
                    <h:outputText value="extends" styleClass="api_package_class_extends"/>
                    <tm:special_link
                            link_url="#{msg['main_components_url.prefix']}UIColumn#{msg['main_components_url.suffix']}"
                            link_text="javax.faces.component.UIColumn"
                            link_tooltip="#{msg['main_components_url.prefix']}UIColumn#{msg['main_components_url.suffix']}"
                            target_blank="_blank" link_style="api_package_class"/>
                </span>
            </div>

            <p>
                <h:outputText value="&lt;h:column&gt; attributes list:" styleClass="h_taglib_subtitles"/>
            </p>
            <h:dataTable value="#{htmlColumnBackingBean.columnAttributesList}"
                         var="columnAttribute" border="1">
                <f:facet name="header">&lt;h:column&gt; attributes list</f:facet>
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{columnAttribute.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Required</f:facet>
                    #{columnAttribute.required}
                </h:column>
                <h:column>
                    <f:facet name="header">Default Value</f:facet>
                    #{columnAttribute.defaultValue}
                </h:column>
                <h:column>
                    <f:facet name="header">Type</f:facet>
                    #{columnAttribute.type}
                </h:column>
                <h:column>
                    <f:facet name="header">Description</f:facet>
                    #{columnAttribute.description}
                </h:column>
            </h:dataTable>

            <p>
                <h:outputText value="&lt;h:column&gt; examples:" styleClass="h_taglib_subtitles"/>
            </p>

            <tm:examples_header title="Example..." render_link="false" notes=""
                                header_style="examples_header_wrapper,examples_header_title_both_templ_frames,examples_header_link,examples_header_notes_both_templ_frames"/>
            <div class="examples_contents">
                Example contents...
            </div>

        </ui:define>

    </ui:composition>

</h:body>
</html>
