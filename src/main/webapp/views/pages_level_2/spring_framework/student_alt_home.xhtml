<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:tm="http://xmlns.jcp.org/jsf/composite/tm_components"
      xmlns:p="http://primefaces.org/ui">

<h:body>

    <ui:composition template="../../templates/pages_level2_template.xhtml">

        <ui:define name="metadata_desc">
            <meta name="description" content="Spring Framework: Simple 'StudentAlt' (alternative) API"/>
        </ui:define>

        <ui:define name="head_page_title">
            <title>Spring Framework: Simple 'StudentAlt' (alternative) API</title>
        </ui:define>

        <ui:define name="center_section_title">
            <h:outputText value="Spring Framework: Simple 'StudentAlt' (alternative) API"/>
        </ui:define>

        <ui:define name="center_section_content">

            <p>
                <h:outputText value="Simple 'StudentAlt' (alternative) API" styleClass="h_taglib_subtitles"/>
            </p>

            <dl class="technology_topics_list_wrapper">
                <dt>Display a StudentAlt (given its ID)</dt>
                <dd>
                    <h:form>
                        <!--
                        In the "p:inputText", if the "value" attribute is defined:
                        - as "long" with no-value assigned, the "p:inputText" will display "0" and not the "placeholder"
                        - as "Long" with no-value assigned (null), the "p:inputText" will display the "placeholder" (not "null")
                        Alternatively, instead of "p:watermark", we can use "p:inputText"'s "placeholder" attribute
                        -->
                        <div class="data_insert_form">
                            <tm:student_alt_id_form studentId="#{inMemoryStudentAltBackingBean.studentId}"
                                                    student_alt_id_form_style_class="input_field"/>
                        </div>

                        <tm:student_alt_data_table
                                title="Display the filtered StudentAlt"
                                studentAltList="#{inMemoryStudentAltBackingBean.studentsAltFilteredList}"
                                data_table_style_class="table_students_alt_list"/>

                        <div>
                            <p:commandButton type="button" value="Find studentAlt">
                                <p:ajax process="@form" update="@form @(.table_students_alt_list)"
                                        listener="#{inMemoryStudentAltBackingBean.displayStudentAltById()}"/>
                            </p:commandButton>
                            <p:commandButton value="Reset form" styleClass="student_alt_reset_btn">
                                <p:ajax process="@form" update="@form"
                                        listener="#{inMemoryStudentAltBackingBean.resetFetchByIdForm()}"/>
                            </p:commandButton>
                        </div>
                    </h:form>
                </dd>

                <dt>Display all the StudentsAlt</dt>
                <dd>
                    <tm:student_alt_data_table title="Display all the StudentsAlt"
                                               studentAltList="#{inMemoryStudentAltBackingBean.fetchAllStudentsAlt()}"
                                               data_table_style_class="table_students_alt_list"/>
                </dd>

                <dt>Add a new StudentAlt</dt>
                <dd>
                    <h:form id="formWhichSavesNewStudentAlt">
                        <div class="data_insert_form">
                            <tm:student_alt_insert_data_form
                                    studentAltModel="#{inMemoryStudentAltBackingBean.studentAltModel}"
                                    student_alt_insert_data_form_style_class="input_field"/>
                        </div>

                        <tm:student_alt_data_table title="Display all the StudentsAlt"
                                                   studentAltList="#{inMemoryStudentAltBackingBean.fetchAllStudentsAlt()}"
                                                   data_table_style_class="table_students_alt_list"/>

                        <div>
                            <p:commandButton type="button" value="Add studentAlt">
                                <p:ajax process="@form" update="@form @(.table_students_alt_list)"
                                        listener="#{inMemoryStudentAltBackingBean.saveNewStudentAlt(inMemoryStudentAltBackingBean.studentAltModel)}"/>
                            </p:commandButton>
                            <p:commandButton value="Reset form" styleClass="student_alt_reset_btn">
                                <p:ajax process="@form" update="@form"
                                        listener="#{inMemoryStudentAltBackingBean.resetSaveForm()}"/>
                            </p:commandButton>
                        </div>
                    </h:form>
                </dd>

                <dt>Update an existing StudentAlt</dt>
                <dd>
                    <h:form id="formWhichUpdatesStudentAlt">
                        <div class="data_insert_form">
                            <tm:student_alt_id_form studentId="#{inMemoryStudentAltBackingBean.studentToUpdateId}"
                                                    student_alt_id_form_style_class="input_field"/>
                        </div>
                        <br/>
                        <div class="data_insert_form">
                            <tm:student_alt_insert_data_form
                                    studentAltModel="#{inMemoryStudentAltBackingBean.studentAltModel}"
                                    student_alt_insert_data_form_style_class="input_field"/>
                        </div>

                        <tm:student_alt_data_table title="Display all the StudentsAlt"
                                                   studentAltList="#{inMemoryStudentAltBackingBean.fetchAllStudentsAlt()}"
                                                   data_table_style_class="table_students_alt_list"/>

                        <div>
                            <p:commandButton type="button" value="Update studentAlt">
                                <p:ajax process="@form" update="@form @(.table_students_alt_list)"
                                        listener="#{inMemoryStudentAltBackingBean.updateStudentAlt(inMemoryStudentAltBackingBean.studentAltModel, inMemoryStudentAltBackingBean.studentToUpdateId)}"/>
                            </p:commandButton>
                            <p:commandButton value="Reset form" styleClass="student_alt_reset_btn">
                                <p:ajax process="@form" update="@form"
                                        listener="#{inMemoryStudentAltBackingBean.resetUpdateForm()}"/>
                            </p:commandButton>
                        </div>
                    </h:form>
                </dd>

                <dt>Delete a StudentAlt (given its ID)</dt>
                <dd>
                    <h:form id="formWhichDeletesStudentAltById">
                        <div class="data_insert_form">
                            <tm:student_alt_id_form studentId="#{inMemoryStudentAltBackingBean.studentToDeleteId}"
                                                    student_alt_id_form_style_class="input_field"/>
                        </div>

                        <tm:student_alt_data_table title="Display all the StudentsAlt"
                                                   studentAltList="#{inMemoryStudentAltBackingBean.fetchAllStudentsAlt()}"
                                                   data_table_style_class="table_students_alt_list"/>

                        <div>
                            <p:commandButton type="button" value="Delete studentAlt">
                                <p:ajax process="@form" update="@form @(.table_students_alt_list)"
                                        listener="#{inMemoryStudentAltBackingBean.deleteStudentAlt()}"/>
                            </p:commandButton>
                            <p:commandButton value="Reset form" styleClass="student_alt_reset_btn">
                                <p:ajax process="@form" update="@form"
                                        listener="#{inMemoryStudentAltBackingBean.resetDeleteForm()}"/>
                            </p:commandButton>
                        </div>
                    </h:form>
                </dd>
            </dl>

        </ui:define>

    </ui:composition>

</h:body>
</html>
